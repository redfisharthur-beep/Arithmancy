name = "arithmancy"
main = "worker/src/index.js"
compatibility_date = "2026-09-30"

[assets]
directory = "./public"
binding = "ASSETS"

[durable_objects]
bindings = [
  { name = "ROOMS", class_name = "Room" },
  { name = "LOBBY", class_name = "Lobby" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Lobby"]
